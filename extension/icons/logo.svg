<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <defs>

    <!-- Gradient bijou : blanc lumineux → bleu Tezos → bleu nuit -->
    <linearGradient id="jewel" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="18%"  stop-color="#90C8FF"/>
      <stop offset="55%"  stop-color="#2C7DF7"/>
      <stop offset="100%" stop-color="#082E80"/>
    </linearGradient>

    <!-- Halo diffus sous le bijou -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#2C7DF7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2C7DF7" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre éclat : double halo bleu autour du logo Tezos -->
    <filter id="shine" x="-70%" y="-70%" width="240%" height="240%">
      <feFlood flood-color="#2C7DF7" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in" result="src"/>
      <feGaussianBlur in="src" stdDeviation="3"  result="halo1"/>
      <feGaussianBlur in="src" stdDeviation="9"  result="halo2"/>
      <feMerge>
        <feMergeNode in="halo2"/>
        <feMergeNode in="halo1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ═══ Diamant Ethereum (présentoir) ══════════════════════════════════ -->
  <!-- Facette haut-gauche (reflet clair) -->
  <polygon points="100,82 30,178 100,151"          fill="#B0BCEF"/>
  <!-- Facette haut-droite (ton moyen) -->
  <polygon points="100,82 170,178 100,151"          fill="#7B8ED9"/>
  <!-- Rhombe central -->
  <polygon points="30,178 100,151 170,178 100,207"  fill="#627EEA"/>
  <!-- Facette bas-gauche (ombre) -->
  <polygon points="30,178 100,276 100,207"           fill="#3D55B5"/>
  <!-- Facette bas-droite (reflet moyen) -->
  <polygon points="170,178 100,276 100,207"          fill="#8A97D5"/>

  <!-- ═══ Halo sous le bijou (centre du losange central) ══════════════ -->
  <ellipse cx="100" cy="178" rx="22" ry="7" fill="url(#glow)"/>

  <!-- ═══ Logo Tezos (bijou) — bas aligné sur le centre du losange y=178 -->
  <!-- scale = 44.5 / 1169.87 ≈ 0.038  →  hauteur = 1593 × 0.038 ≈ 60.5px -->
  <!-- centré x : 100 − 44.5/2 ≈ 78 ; translate y = 178 − 60.5 ≈ 117      -->
