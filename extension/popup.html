<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TezosX Relayer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 120px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #f8fafc;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      background: #1d4ed8;
      color: white;
    }
    header .logo {
      width: 22px; height: 22px;
      background: white;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #1d4ed8;
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    header .badge {
      font-size: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 1px 6px;
    }

    /* ── Body ── */
    main { padding: 12px 14px; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 20px 0 12px;
      font-size: 12px;
    }
    .empty .icon { font-size: 28px; margin-bottom: 6px; }

    /* ── Session card ── */
    .session {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .session:last-child { margin-bottom: 0; }

    .session .origin {
      font-weight: 600;
      font-size: 13px;
      color: #0f172a;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session .field {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }
    .session .label {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      width: 30px;
      flex-shrink: 0;
    }
    .session .value {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      color: #334155;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session .chain-badge {
      display: inline-block;
      font-size: 10px;
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 4px;
      padding: 1px 5px;
      font-weight: 500;
    }
    .session .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .btn-disconnect {
      font-size: 11px;
      padding: 3px 10px;
      border: 1px solid #fca5a5;
      background: #fff;
      color: #dc2626;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-disconnect:hover { background: #fef2f2; }

    /* ── Footer ── */
    footer {
      padding: 8px 14px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">T</div>
    <h1>TezosX Relayer</h1>
    <span class="badge" id="count">0 site</span>
  </header>

  <main>
    <div id="sessions"></div>
  </main>

  <footer>Tezos X Testnet · EIP-1193 bridge</footer>

  <script src="dist/popup.js"></script>
</body>
</html>
